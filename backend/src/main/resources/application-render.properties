# Render Web Service: the load balancer terminates TLS and forwards HTTP to
# the container on $PORT. The service itself is not publicly reachable.
server.port=${PORT:10000}
server.address=0.0.0.0
server.forward-headers-strategy=none

# request.isSecure() is false behind the balancer, so Spring's channel
# requirement is off. RenderEdgeFilter rejects direct HTTP and any
# X-Forwarded-Proto other than https. Do not enable Basic or disable sessions.
abigail.security.require-https=false
abigail.security.session-mode=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Required from the Render environment; there is deliberately no default.
abigail.render.public-origin=${ABIGAIL_RENDER_PUBLIC_ORIGIN}
abigail.render.edge-confirmed=${ABIGAIL_RENDER_EDGE_CONFIRMED:false}
