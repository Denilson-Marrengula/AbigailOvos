# TEST ONLY: Railway terminates HTTPS at its edge. The app receives internal HTTP.
# Do not use this profile outside an isolated Railway test project.
server.port=${PORT:8080}
server.forward-headers-strategy=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
abigail.security.require-https=false
# Temporary compatibility for the isolated legacy test API, not for real data.
abigail.security.session-mode=false
