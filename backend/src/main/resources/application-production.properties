# Direct TLS termination. Set only through the deployment environment; no bundled key.
server.ssl.enabled=true
server.ssl.key-store=${TLS_KEYSTORE_PATH}
server.ssl.key-store-password=${TLS_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.forward-headers-strategy=none
abigail.security.require-https=true
